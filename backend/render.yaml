services:
  - type: web
    name: pulseloop-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: ML_SERVICE_URL
        value: https://pulseloop-ml.onrender.com
      - key: CORS_ORIGIN
        value: https://pulse-sathi-rosy.vercel.app
      - key: WHATSAPP_MODE
        value: mock
      - key: WHATSAPP_VERIFY_TOKEN
        value: pulsesathi-verify-2026
      - key: WHATSAPP_API_VERSION
        value: v18.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: TWILIO_REMINDER_CONTENT_SID
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://pulseloop-backend-5il0.onrender.com
      - key: REMINDER_CHECK_INTERVAL_MS
        value: 60000
      - key: REMINDER_MAX_PER_DOSE
        value: 2
      - key: REMINDER_LEAD_TIME_MINUTES
        value: 15
